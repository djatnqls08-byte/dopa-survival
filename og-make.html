<!doctype html>
<!-- 링크 미리보기(OG) 이미지 만들기용 (배포 대상 아님 · 로컬에서 열면 og.png 를 그려 /__save 로 저장) -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head><body style="margin:0;background:#111">
<canvas id="c" width="1200" height="630" style="width:100%"></canvas>
<script>
(async () => {
  await Promise.all([document.fonts.load("800 80px 'Pretendard Variable'"), document.fonts.load("400 30px 'Gowun Batang'"), document.fonts.load("600 24px 'IBM Plex Mono'")]).catch(() => {});
  const c = document.getElementById("c"), x = c.getContext("2d"), W = 1200, H = 630;
  const SANS = "'Pretendard Variable', sans-serif", SERIF = "'Gowun Batang', serif", MONO = "'IBM Plex Mono', monospace";
  x.fillStyle = "#121314"; x.fillRect(0, 0, W, H);
  // 오른쪽: 엘리베이터 층 표시등 B4 (붉은 빛)
  const g = x.createRadialGradient(930, 300, 0, 930, 300, 380); g.addColorStop(0, "rgba(240,24,94,.28)"); g.addColorStop(1, "rgba(240,24,94,0)"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let n = 0; n < 9000; n++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; x.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5); }
  x.strokeStyle = "#2A2C2F"; x.lineWidth = 3; x.strokeRect(800, 150, 260, 300); x.beginPath(); x.moveTo(930, 150); x.lineTo(930, 450); x.stroke();
  x.fillStyle = "#1B1C1E"; x.fillRect(855, 92, 150, 70); x.strokeRect(855, 92, 150, 70);
  x.fillStyle = "#F0185E"; x.shadowColor = "#F0185E"; x.shadowBlur = 24; x.font = `600 48px ${MONO}`; x.textAlign = "center"; x.fillText("B4", 930, 145); x.shadowBlur = 0; x.textAlign = "left";
  // 왼쪽 글
  x.fillStyle = "#a78bfa"; x.strokeStyle = "rgba(167,139,250,.5)"; x.lineWidth = 2; x.beginPath(); x.roundRect(80, 86, 92, 40, 20); x.stroke(); x.font = `700 22px ${SANS}`; x.fillText("괴담", 103, 114);
  x.fillStyle = "#9A9DA2"; x.font = `600 22px ${MONO}`; x.fillText("DOPA 이상현상 기록보관소", 190, 114);
  x.fillStyle = "#F2F2F0"; x.font = `800 78px ${SANS}`; x.fillText("지하 4층", 80, 230); x.fillText("야간 순찰", 80, 320);
  x.fillStyle = "#cfcfcd"; x.font = `400 30px ${SERIF}`;
  ["대답하지 말 것", "세지 말 것", "6시 전에는 나오지 말 것"].forEach((t, i) => { x.fillStyle = "#F0185E"; x.font = `600 22px ${MONO}`; x.fillText(`0${i + 1}`, 80, 392 + i * 46); x.fillStyle = "#cfcfcd"; x.font = `400 30px ${SERIF}`; x.fillText(t, 124, 394 + i * 46); });
  x.fillStyle = "#D9FF3F"; x.font = `700 26px ${SANS}`; x.fillText("내 캐릭터는 살아 나올 수 있을까? · 선택형 텍스트 괴담", 80, 572);
  try { const im = new Image(); im.src = "logo.svg"; await im.decode(); x.drawImage(im, W - 80 - 56, 534, 56, 56); } catch (e) {}
  const d = c.toDataURL("image/png"); await fetch("/__save", { method: "POST", body: d }); document.title = "saved";
})();
</script></body></html>
